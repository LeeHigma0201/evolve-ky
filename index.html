<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do you really need a panel upgrade? · ChargeRight × Evolve KY</title>
<meta name="description" content="Jason Walls — Evolve KY, July 26. Do you really need a panel upgrade for your EV charger? Usually not.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F1; --card:#FFFFFF; --ink:#171C2B; --soft:#525A6E; --faint:#8A91A2;
    --line:#E7E4DA; --line2:#DBD8CD;
    --blue:#1D5FE0; --blue-ink:#1A52C0; --green:#12986A; --amber:#C77D0A; --red:#D23B2E;
    --blue-wash:rgba(29,95,224,.13); --green-wash:rgba(18,152,106,.16);
    --sans:"DM Sans",system-ui,-apple-system,sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--line) .9px, transparent .9px);background-size:26px 26px}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);width:0;transition:width .3s cubic-bezier(.4,0,.2,1);z-index:9}
  .stage{position:relative;z-index:2;width:min(1060px,94vw);height:min(650px,92vh);
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 40px 80px -50px rgba(23,28,43,.5),0 2px 0 var(--line)}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:clamp(32px,5.2vw,72px)}
  .slide.active{display:flex}
  .slide.active > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .slide.active > *:nth-child(2){animation-delay:.05s}
  .slide.active > *:nth-child(3){animation-delay:.1s}
  .slide.active > *:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* logo (top rule) */
  .brand{display:flex;align-items:center;gap:10px;position:absolute;top:clamp(26px,4vw,40px);left:clamp(32px,5.2vw,72px)}
  .brand .mark{width:26px;height:26px;color:var(--ink)}
  .brand .mark .bolt{fill:var(--blue)}
  .brand .wm{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .brand .wm b{color:var(--blue)}
  .kicker{font-family:var(--mono);font-size:clamp(10px,1.2vw,12.5px);letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:0 0 clamp(14px,2.2vw,20px);display:inline-flex;align-items:center;gap:10px}
  .kicker::before{content:"";width:22px;height:2px;background:var(--blue)}
  h1{font-weight:900;line-height:1.0;letter-spacing:-.035em;margin:0;font-size:clamp(34px,6.4vw,72px);max-width:15ch}
  h2{font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:0;font-size:clamp(28px,4.8vw,54px);max-width:17ch}
  .body{margin:clamp(16px,2.3vw,24px) 0 0;font-size:clamp(17px,2.2vw,26px);line-height:1.45;color:var(--soft);max-width:32ch}
  .body b{color:var(--ink);font-weight:700}
  /* highlighter — human, editorial emphasis (not gradient) */
  .hl{background:linear-gradient(120deg,var(--blue-wash),var(--blue-wash));box-shadow:0 0 0 3px var(--blue-wash);border-radius:3px;padding:0 .05em}
  .hl-g{background:var(--green-wash);box-shadow:0 0 0 3px var(--green-wash);border-radius:3px;padding:0 .05em}
  .u{background:linear-gradient(var(--blue),var(--blue)) bottom/100% .12em no-repeat;padding-bottom:.02em}
  .byline{margin-top:clamp(22px,4vw,38px);font-family:var(--mono);font-size:clamp(12px,1.5vw,14px);color:var(--soft)}
  .link{color:var(--blue);font-weight:700}
  .big{font-weight:900;letter-spacing:-.045em;line-height:.88;font-size:clamp(58px,12vw,140px);color:var(--ink);margin:clamp(8px,1.6vw,16px) 0}
  .caplabel{font-family:var(--mono);font-size:clamp(11px,1.4vw,14px);letter-spacing:.02em;color:var(--faint);text-transform:uppercase}
  .foot{position:absolute;left:clamp(32px,5.2vw,72px);bottom:clamp(24px,3vw,30px);font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
  .count{position:absolute;right:clamp(32px,5.2vw,72px);bottom:clamp(24px,3vw,30px);font-family:var(--mono);font-size:12px;color:var(--soft)}
  .count b{color:var(--blue)}
  /* rehearsal timer — off by default, toggle with T */
  #timer{position:fixed;top:12px;right:14px;z-index:11;display:none;gap:12px;align-items:baseline;
    font-family:var(--mono);background:var(--card);border:1px solid var(--line2);border-radius:10px;
    padding:8px 13px;box-shadow:0 10px 26px -18px rgba(23,28,43,.7)}
  #timer.show{display:flex}
  #timer .tt{font-weight:700;color:var(--ink);font-size:14px}
  #timer .ts{font-size:11.5px;color:var(--soft)}
  #timer .ts.near{color:var(--amber);font-weight:700}
  #timer .ts.over{color:var(--red);font-weight:700}
  .nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:9}
  .nav button{font-family:var(--mono);font-size:15px;border:1px solid var(--line2);background:var(--card);color:var(--soft);width:42px;height:32px;border-radius:8px;cursor:pointer}
  .nav button:hover{border-color:var(--blue);color:var(--blue)}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:44vh;overflow:auto;z-index:10;background:var(--ink);color:#EBEEF5;
    border-top:3px solid var(--blue);padding:20px clamp(24px,6vw,80px);font-size:15px;line-height:1.55;transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  #notes.show{transform:none}
  #notes .nlabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6ea0ff;margin-bottom:6px}
  /* title */
  .logo-lg{display:flex;align-items:center;gap:14px;margin-bottom:clamp(18px,3vw,28px)}
  .logo-lg .mark{width:clamp(44px,6vw,64px);height:clamp(44px,6vw,64px);color:var(--ink)}
  .logo-lg .mark .bolt{fill:var(--blue)}
  .logo-lg .wm{font-size:clamp(24px,3.6vw,36px);font-weight:900;letter-spacing:-.03em}
  .logo-lg .wm b{color:var(--blue)}
  /* houses (social proof) */
  .houses{display:flex;gap:clamp(6px,1.4vw,16px);margin:clamp(12px,2vw,20px) 0 clamp(6px,1vw,12px);align-items:flex-end}
  .houses svg{width:clamp(40px,7vw,82px);height:auto}
  .h-ok{color:var(--green)} .h-no{color:var(--red);opacity:.9}
  .houses .tag{font-family:var(--mono);font-size:12px;color:var(--faint);align-self:center;margin-left:6px}
  /* product steps */
  .steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:clamp(8px,1.4vw,14px);margin-top:clamp(18px,3vw,28px)}
  .step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);text-align:center}
  .step .si{width:clamp(28px,3.6vw,40px);height:clamp(28px,3.6vw,40px);margin:0 auto 12px;color:var(--blue)}
  .step h4{margin:0 0 6px;font-size:clamp(15px,1.8vw,20px);font-weight:800}
  .step p{margin:0;font-size:clamp(12px,1.5vw,15px);color:var(--soft);line-height:1.35}
  .arrow{align-self:center;color:var(--line2);font-size:22px;font-family:var(--mono)}
  /* quote */
  .quote{margin:clamp(16px,2.6vw,26px) 0 0;font-weight:800;line-height:1.24;letter-spacing:-.02em;font-size:clamp(23px,3.5vw,42px);max-width:22ch;position:relative;padding-left:clamp(16px,2vw,22px)}
  .quote::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:5px;border-radius:3px;background:var(--blue)}
  /* close + qr */
  .close{display:grid;grid-template-columns:1fr auto;gap:clamp(24px,4vw,56px);align-items:center}
  .qrbox{background:#fff;padding:14px;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -24px rgba(23,28,43,.4)}
  .qrbox img{width:clamp(130px,19vw,184px);height:auto;display:block}
  .qrcap{font-family:var(--mono);font-size:12px;color:var(--soft);text-align:center;margin-top:10px;max-width:22ch}
  /* ===== CALCULATOR — "how full is your panel" ===== */
  .calc{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(16px,2.6vw,30px);align-items:stretch;margin-top:6px}
  .calc h2{font-size:clamp(21px,2.9vw,30px);margin-bottom:12px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .fld input,.fld select{font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;width:100%;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .toggles{grid-column:1/3;display:flex;flex-wrap:wrap;gap:7px}
  .tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:20px;padding:6px 12px;cursor:pointer}
  .tog input{accent-color:var(--blue);width:15px;height:15px}
  .tog:has(input:checked){border-color:var(--blue);background:var(--blue-wash)}
  /* ===== video insert slides (NotebookLM clips) ===== */
  /* Portrait clip (NotebookLM Shorts are 9:16) beside the beats, so the 16:9
     frame is filled instead of letterboxing a skinny strip into black bars. */
  .vidwrap{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2.8vw,36px);
    align-items:center;margin-top:clamp(8px,1.4vw,16px)}
  .vid{display:block;height:clamp(230px,47vh,430px);width:auto;max-width:40vw;
    border-radius:12px;border:1px solid var(--line2);background:#0B0F18;
    box-shadow:0 22px 44px -30px rgba(23,28,43,.8)}
  .vidfall{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,2vw,22px)}
  .vf-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:9px}
  .vidbeats{margin:0;padding-left:19px;font-size:clamp(14px,1.8vw,21px);line-height:1.45;color:var(--soft)}
  .vidbeats li{margin-bottom:clamp(7px,1.1vw,12px)}
  .vidbeats li b{color:var(--ink);font-weight:700}
  .vidskip{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;margin-top:10px}
  @media (max-width:860px){ .vidwrap{grid-template-columns:1fr} .vid{max-width:100%;margin:0 auto} }
  /* ===== "this panel is full / it's barely working" ===== */
  .pnl{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,38px);align-items:center;margin-top:clamp(10px,1.6vw,18px)}
  .pbox{background:#EFEDE6;border:2px solid var(--line2);border-radius:10px;padding:10px 9px 8px;width:clamp(150px,19vw,208px)}
  .pbox-h{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--soft);text-align:center;margin-bottom:7px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 5px}
  .brk{display:block;background:var(--card);border:1px solid var(--line2);border-radius:2px;
    font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--soft);text-align:center;padding:2.5px 0}
  .pbox-f{font-family:var(--mono);font-size:9px;color:var(--red);text-align:center;margin-top:7px;font-weight:700}
  .pbars{display:flex;flex-direction:column;gap:clamp(7px,1.1vw,11px)}
  .pb{display:grid;grid-template-columns:clamp(96px,13vw,150px) 1fr auto;gap:10px;align-items:center}
  .pb-l{font-family:var(--mono);font-size:clamp(9.5px,1.15vw,12px);color:var(--soft);line-height:1.25}
  .pb-t{position:relative;height:clamp(17px,2.3vw,25px);background:#EEEBE2;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
  .pb-f{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .pb-v{font-family:var(--mono);font-size:clamp(11px,1.4vw,15px);font-weight:700;min-width:52px;text-align:right}
  .pb-lim{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);z-index:2}
  .pb-limcap{font-family:var(--mono);font-size:9px;color:var(--soft);position:absolute;top:-15px;transform:translateX(-50%);white-space:nowrap}
  .limrow{position:relative;height:14px}
  .miles{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--green);padding-top:9px}
  .cite{grid-column:1/3;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.5}
  .out{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);display:flex;flex-direction:column;gap:12px}
  .rowtop{display:flex;align-items:baseline;gap:10px}
  .rowtop .amps{font-weight:900;font-size:clamp(42px,6.6vw,62px);letter-spacing:-.04em;line-height:.85;color:var(--ink)}
  .rowtop .of{font-family:var(--mono);font-size:13px;color:var(--soft)}
  .rowtop .util{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--soft)}
  .meter{position:relative;height:40px;border-radius:9px;overflow:hidden;background:#EEEBE2;border:1px solid var(--line2)}
  .zones{position:absolute;inset:0;display:flex}
  .z-g{background:rgba(18,152,106,.16)} .z-a{background:rgba(199,125,10,.18)} .z-r{background:rgba(210,59,46,.18)}
  .fill{position:absolute;top:6px;bottom:6px;left:6px;display:flex;border-radius:6px;overflow:hidden;transition:width .5s cubic-bezier(.3,.7,.2,1);max-width:calc(100% - 12px)}
  .f-exist{background:var(--blue)} .f-ev{background:var(--green)}
  .limit{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);transition:left .5s}
  .limit::after{content:"your limit";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--soft);white-space:nowrap}
  .legend{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--soft);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .verdict{border-radius:11px;padding:13px 15px;font-weight:800;font-size:clamp(16px,1.9vw,21px);line-height:1.2;border:1px solid}
  .verdict small{display:block;font-family:var(--mono);font-weight:400;font-size:12px;margin-top:6px;opacity:.95;letter-spacing:.01em}
  .v-comfortable{background:rgba(18,152,106,.10);color:var(--green);border-color:rgba(18,152,106,.4)}
  .v-tight{background:rgba(199,125,10,.10);color:var(--amber);border-color:rgba(199,125,10,.4)}
  .v-exceeds{background:rgba(210,59,46,.09);color:var(--red);border-color:rgba(210,59,46,.4)}
  @media (max-width:860px){ .calc,.close{grid-template-columns:1fr} .steps{grid-template-columns:1fr} .arrow{transform:rotate(90deg)} }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage" class="stage"></div>
<div class="nav"><button id="prev">&lsaquo;</button><button id="next">&rsaquo;</button></div>
<div id="notes"><div class="nlabel">Speaker note</div><div id="ntext"></div></div>
<div id="timer"><span class="tt" id="t_total">0:00</span><span class="ts" id="t_slide"></span></div>
<script>
const MARK=`<svg class="mark" viewBox="0 0 120 120" fill="none"><path d="M60 15 L101 46 V95 a7 7 0 0 1-7 7 H26 a7 7 0 0 1-7-7 V46 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path class="bolt" d="M66 38 L40 72 H57 L52 94 L82 56 H63 Z"/></svg>`;
const WORD=`<span class="wm">Charge<b>Right</b></span>`;
const IC={
  camera:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>`,
  calc:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2m3 0h3M8 14h2m3 0h3M8 18h2m3 0h3"/></svg>`,
  check:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>`
};
const HOUSE=c=>`<svg class="${c}" viewBox="0 0 120 120" fill="none"><path d="M60 15 L101 46 V95 a7 7 0 0 1-7 7 H26 a7 7 0 0 1-7-7 V46 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path d="M66 40 L42 70 H57 L52 90 L80 58 H62 Z" fill="currentColor"/></svg>`;

const slides=[
  { type:"title",
    note:"COLD OPEN — say it, don't read it:<br><br>&ldquo;Show of hands &mdash; who&rsquo;s heard of the <b>Tesla tax</b>?&rdquo; <i>(hands)</i><br>&ldquo;Now &mdash; not the one on your registration. That one&rsquo;s a hundred and some-odd bucks a year and there&rsquo;s nothing I can do about it.&rdquo; <i>(laugh)</i><br>&ldquo;I mean the other one. Where you mention you&rsquo;re getting an EV, and the number goes up. <b>Keep your hand up</b> if you&rsquo;ve been quoted to upgrade your panel.&rdquo; <i>(hands)</i><br>&ldquo;Three grand? Four?&rdquo; <i>(beat)</i><br>&ldquo;<b>That&rsquo;s the Tesla tax. And most of you don&rsquo;t owe it.</b>&rdquo;<br><br>Don&rsquo;t pause after the first question &mdash; in KY they&rsquo;ll think you mean the registration fee. Define it in the same breath." },
  { label:"Who I am", head:"I&rsquo;m Jason. A master electrician.",
    body:"I do this math every day. And <b>I don&rsquo;t do installs</b> &mdash; so I&rsquo;ve got no reason to want you to need one. I built the tool because I got tired of watching good people pay for upgrades they never needed.",
    note:"AUTHORITY + MOTIVE. You ARE the proof — no slide needed.<br><br>THE LINE THAT KILLS EVERY 'WHAT'S YOUR ANGLE' QUESTION BEFORE IT'S ASKED: &ldquo;<b>I don't do installs. So I've got nothing to sell you but twelve ninety-nine worth of math.</b>&rdquo;<br><br>Say it early and say it flat. Everything after this lands harder because they've already decided you're not working them." },
  { type:"anchor", label:"The moment", head:"You bought the car. Then came the quote.",
    big:"$3,000&ndash;$5,000", caplabel:"what an installer quotes to &ldquo;upgrade your panel&rdquo; first",
    body:"Most of you won&rsquo;t spend a <span class='hl-g'>dime</span> of that.",
    note:"ANCHOR + LOSS AVERSION. Let the big number sit three full seconds — that's money about to leave their pocket. Then take it back.<br><br>THEN THE BEAT THAT'S BUILT FOR THIS ROOM: &ldquo;And here's the part that ought to bother everybody in here &mdash; some of them get that quote and they just don't buy the car.&rdquo;<br><br>That turns you from a guy saving them money into a guy removing the biggest barrier to the thing this club exists for. It's why they'll pass it on." },
  { type:"stat", label:"The truth", head:"Most of you don&rsquo;t need it.", big:"4 of 5",
    body:"In the homes I check, about <span class='hl'>four out of five</span> already have the room.",
    note:"SOCIAL PROOF. 'People like you, in houses like yours — 80% were fine.' The green houses do the work." },
  { label:"Straight talk", head:"And I&rsquo;ll tell you who <span class='u'>actually does.</span>",
    body:"Older homes on a small panel that&rsquo;s already full. All-electric houses near their limit. <b>If that&rsquo;s you, I&rsquo;ll say so.</b> Knowing the difference is the whole point.",
    note:"RECIPROCITY/HONESTY. Admitting when they DO need it is what makes them trust the 'you don't' — you're not just selling a no." },
  { label:"So why the quote, then?", head:"Because the math takes ten minutes. The upsell takes ten <span class='hl'>seconds.</span>",
    body:"Some installers skip the calculation and just sell the upgrade. It&rsquo;s faster, and it pays more.",
    note:"CONTRAST/VILLAIN. Not anti-EV, anti-lazy-upsell. Positions you + ChargeRight as the honest shortcut." },
  { label:"The part they skip", head:"Your panel is <span class='u'>barely working.</span>",

const stage=document.getElementById('stage'),bar=document.getElementById('bar');
const notesEl=document.getElementById('notes'),ntext=document.getElementById('ntext');
let i=0,notesOpen=false;

/* ---- "the panel is full but barely loaded" ----
   Breakers sum to 410 A on a 200 A service. The three method results all include
   the same 48 A charger at 100% (no demand factor, per the 2023 EVSE rule), on a
   2000 ft² house: range 8000, dryer 5000, 3-ton AC, gas heat. See rehearsal/RUN-CARD.md. */
const BRK=[50,20,30,20,40,15,20,15,20,15,20,15,20,15,15,15,15,15,15,20];
const METHODS=[
  {k:'Add up the breakers<br><i>(not a load calculation)</i>',v:410,c:'var(--red)'},
  {k:'Standard method<br><i>Article 220, Part III</i>',v:141,c:'var(--green)'},
  {k:'Optional<br><i>NEC 220.82</i>',v:127,c:'var(--green)'},
  {k:'Existing dwelling<br><i>NEC 220.83(A)</i>',v:113,c:'var(--green)'}
];
/* Video insert. Autoplays on advance (the page already has user interaction from
   the keypress, so audio is allowed). If the mp4 is missing or won't decode, the
   fallback bullets take over — the deck must never dead-end on stage. */
function videoMarkup(s){
  // Beats are ALWAYS on screen — they reinforce the narration and give the room
  // something to read. If the clip dies they simply become the whole slide.
  return `<div class="vidwrap" id="vidwrap">
      <video id="vid" class="vid" src="${s.src}" tabindex="-1" playsinline controls preload="auto"></video>
      <div class="vidfall">
        <div class="vf-h" id="vf_h" style="display:none">Video didn&rsquo;t load &mdash; say this instead</div>
        <ul class="vidbeats">${s.fallback.map(f=>`<li>${f}</li>`).join('')}</ul>
      </div>
    </div>
    <p class="vidskip">plays automatically &middot; &rarr; to move on &middot; cuttable if you&rsquo;re running long</p>`;
}
function wireVideo(){
  const v=document.getElementById('vid'),h=document.getElementById('vf_h'),w=document.getElementById('vidwrap');
  if(!v) return;
  const fail=()=>{v.style.display='none';if(h)h.style.display='block';if(w)w.style.gridTemplateColumns='1fr';};
  v.addEventListener('error',fail);
  // a src that 404s to an HTML page doesn't always fire 'error' — check the load state too
  setTimeout(()=>{if(v.networkState===v.NETWORK_NO_SOURCE||(v.readyState===0&&!v.currentSrc))fail();},1800);
  const p=v.play(); if(p&&p.catch)p.catch(()=>{}); // blocked autoplay is fine — controls are right there
}
function panelMythMarkup(){
  const SCALE=410,LIM=200,lp=LIM/SCALE*100;
  const sum=BRK.reduce((a,b)=>a+b,0);
  const bars=METHODS.map(m=>`<div class="pb">
      <div class="pb-l">${m.k}</div>
      <div class="pb-t"><div class="pb-f" style="width:${m.v/SCALE*100}%;background:${m.c}"></div>
        <div class="pb-lim" style="left:${lp}%"></div></div>
      <div class="pb-v" style="color:${m.c}">${m.v} A</div></div>`).join('');
  return `<div class="pnl">
    <div class="pbox"><div class="pbox-h">MAIN &mdash; 200 A</div>
      <div class="pgrid">${BRK.map(n=>`<span class="brk">${n}</span>`).join('')}</div>
      <div class="pbox-f">NO OPEN SLOTS</div></div>
    <div class="pbars">
      <div class="pb"><div></div><div class="limrow"><span class="pb-limcap" style="left:${lp}%">your 200 A limit</span></div><div></div></div>
      ${bars}
      <p class="pb-l" style="margin:6px 0 0;color:var(--ink);font-family:var(--sans);font-size:clamp(12px,1.5vw,16px);line-height:1.4">
        Same panel. Same house. Same charger. <b>${sum} amps of breakers &mdash; and every real method says it fits.</b></p>
    </div></div>`;
}
function calcMarkup(){
  return `<div class="calc"><div>
    <h2 id="chead"></h2>
    <div class="fields">
      <div class="fld"><label>Home size (ft²)</label><input type="number" id="c_sqft" value="2000" min="0" step="100"></div>
      <div class="fld"><label>Service size (A)</label><select id="c_panel"><option>100</option><option>125</option><option>150</option><option selected>200</option></select></div>
      <div class="fld"><label>Central AC (tons)</label><input type="number" id="c_ac" value="3" min="0" step="0.5"></div>
      <div class="fld"><label>Electric heat (kW · 0=gas)</label><input type="number" id="c_heat" value="0" min="0" step="1"></div>
      <div class="fld"><label>Charge at (amps)</label><select id="c_ev"><option>12</option><option>16</option><option>24</option><option>32</option><option>40</option><option selected>48</option></select></div>
      <div class="fld"><label>Range added overnight</label><div id="c_miles" class="miles">—</div></div>
      <div class="toggles">
        <label class="tog"><input type="checkbox" id="c_range" checked>Electric range</label>
        <label class="tog"><input type="checkbox" id="c_dryer" checked>Electric dryer</label>
        <label class="tog"><input type="checkbox" id="c_wh">Electric water heater</label>
        <label class="tog"><input type="checkbox" id="c_tub">Hot tub</label>
      </div>
      <div class="cite">NEC 220.82 optional method · 3 VA/ft² · first 10 kVA @100% + 40% · verdict vs service per 230.79</div>
    </div></div>
    <div class="out">
      <div class="rowtop"><span class="amps" id="c_amps">—</span><span class="of" id="c_of"></span><span class="util" id="c_util"></span></div>
      <div class="meter"><div class="zones"><span class="z-g" id="z_g"></span><span class="z-a" id="z_a"></span><span class="z-r" id="z_r"></span></div><div class="fill" id="c_fill"><span class="f-exist" id="f_exist"></span><span class="f-ev" id="f_ev"></span></div><div class="limit" id="c_limit"></div></div>
      <div class="legend"><span><i style="background:var(--blue)"></i>What your home pulls</span><span><i style="background:var(--green)"></i>Your EV charger</span></div>
      <div id="c_verdict"></div>
    </div></div>`;
}
function computeCalc(){
  const n=id=>parseFloat(document.getElementById(id).value)||0,ck=id=>document.getElementById(id).checked;
  const sqft=n('c_sqft'),panel=n('c_panel'),acTons=n('c_ac'),heatKW=n('c_heat'),evAmps=n('c_ev');
  let fixed=0; if(ck('c_range'))fixed+=8000; if(ck('c_dryer'))fixed+=5000; if(ck('c_wh'))fixed+=4500; if(ck('c_tub'))fixed+=6000;
  const before=sqft*3+2*1500+1*1500+fixed;
  const demand=Math.min(10000,before)+Math.max(0,before-10000)*0.4;
  const hvac=Math.max(acTons*1200,heatKW*1000*0.65);
  const existingA=(demand+hvac)/240,totalA=(demand+hvac+evAmps*240)/240;
  const safe=panel*0.8,status=totalA<=safe?'comfortable':(totalA<=panel?'tight':'exceeds');
  const headroom=Math.max(0,panel-totalA),util=panel?totalA/panel*100:0;
  const R=x=>Math.round(x).toLocaleString();
  /* range added over an 8-hour night, ~3.5 mi/kWh — the "you need less than you think" lever */
  document.getElementById('c_miles').textContent='≈ '+R(evAmps*240/1000*8*3.5)+' mi';
  document.getElementById('c_amps').textContent=R(totalA)+' A';
  document.getElementById('c_of').textContent='of '+R(panel)+' A service';
  document.getElementById('c_util').textContent=Math.round(util)+'% used';
  const scale=Math.max(panel,totalA)*1.08,p=x=>Math.min(100,x/scale*100);
  document.getElementById('z_g').style.width=p(panel*0.8)+'%';
  document.getElementById('z_a').style.width=(p(panel)-p(panel*0.8))+'%';
  document.getElementById('z_r').style.width=(100-p(panel))+'%';
  document.getElementById('c_fill').style.width=p(totalA)+'%';
  const tot=Math.max(p(totalA),0.001);
  document.getElementById('f_exist').style.width=(p(existingA)/tot*100)+'%';
  document.getElementById('f_ev').style.width=((p(totalA)-p(existingA))/tot*100)+'%';
  document.getElementById('c_limit').style.left=p(panel)+'%';
  const msg={
    comfortable:['&#10003; You&rsquo;ve got room. No upgrade needed.','That&rsquo;s '+R(headroom)+' A to spare &mdash; and likely a few thousand dollars you keep.'],
    tight:['It fits &mdash; but it&rsquo;s tight.','Only '+R(headroom)+' A left. Load management is the smart, cheaper fix (not a whole new panel).'],
    exceeds:['This one really does need attention.','You&rsquo;re past the limit &mdash; the ~1 in 5 where an upgrade or load management is honest advice.']
  }[status];
  document.getElementById('c_verdict').innerHTML=`<div class="verdict v-${status}">${msg[0]}<small>${msg[1]}</small></div>`;
}
function wireCalc(){
  document.getElementById('chead').innerHTML=slides[i].head;
  ['c_sqft','c_panel','c_ac','c_heat','c_ev','c_range','c_dryer','c_wh','c_tub'].forEach(id=>{
    const el=document.getElementById(id); el.addEventListener('input',computeCalc); el.addEventListener('change',computeCalc);});
  computeCalc();
}
function chrome(){return `<div class="brand">${MARK}${WORD}</div><div class="foot">← → move · N notes · T timer</div><div class="count"><b>${String(i+1).padStart(2,'0')}</b> / ${slides.length}</div>`;}
function render(){
  const s=slides[i]; let inner='';
  if(s.type==='title'){
    inner=`<div class="logo-lg">${MARK}${WORD}</div>
      <p class="kicker">Evolve Kentucky · July 26</p>
      <h1>Do you really need a <span class="hl">panel upgrade</span> for your EV charger?</h1>
      <p class="body" style="max-width:34ch">Usually not. Let me save you a few thousand dollars.</p>
      <p class="byline">Jason Walls · Master Electrician · IBEW 369 · <span class="link">evchargeright.com</span></p>`;
    stage.innerHTML=`<section class="slide active">${inner}<div class="foot">← → move · N notes · T timer</div><div class="count"><b>01</b> / ${slides.length}</div></section>`;
  } else {
    if(s.type==='video') inner=`<p class="kicker">${s.label}</p><h2 style="font-size:clamp(21px,3vw,34px);max-width:26ch">${s.head}</h2>`+videoMarkup(s);
    else if(s.type==='panelmyth') inner=`<p class="kicker">${s.label}</p><h2 style="font-size:clamp(22px,3.2vw,38px);max-width:24ch">${s.head}</h2>`+panelMythMarkup();
    else if(s.type==='calc') inner=`<p class="kicker">${s.label}</p>`+calcMarkup();
    else if(s.type==='anchor') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><div class="big">${s.big}</div><p class="caplabel">${s.caplabel}</p><p class="body">${s.body}</p>`;
    else if(s.type==='stat') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><div class="big">${s.big}</div><div class="houses">${HOUSE('h-ok')}${HOUSE('h-ok')}${HOUSE('h-ok')}${HOUSE('h-ok')}${HOUSE('h-no')}<span class="tag">= have room</span></div><p class="body">${s.body}</p>`;
    else if(s.type==='product') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><div class="steps"><div class="step">${IC.camera}<h4>1 · Pick your car</h4><p>And the charger you want.</p></div><div class="arrow">→</div><div class="step">${IC.calc}<h4>2 · Snap your panel</h4><p>It runs the NEC 220.82 calc.</p></div><div class="arrow">→</div><div class="step">${IC.check}<h4>3 · Get the report</h4><p>Plain English. Hand it to any contractor.</p></div></div><p class="body" style="max-width:42ch">${s.body} <span class="link">evchargeright.com</span></p>`;
    else if(s.type==='quote') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><p class="quote">&ldquo;${s.quote}&rdquo;</p>`;
    else if(s.type==='close') inner=`<p class="kicker">${s.label}</p><div class="close"><div><h2>${s.head}</h2><p class="body">${s.body}</p><p class="byline"><span class="link">${s.url}</span></p></div><div><div class="qrbox"><img src="qr.svg" alt="QR to evchargeright.com"></div><div class="qrcap">Scan it — or text it to someone about to buy an EV</div></div></div>`;
    else inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><p class="body">${s.body}</p>`;
    stage.innerHTML=`<section class="slide active">${chrome()}${inner}</section>`;
    if(s.type==='calc') wireCalc();
    else if(s.type==='video') wireVideo();
  }
  bar.style.width=(i/(slides.length-1)*100)+'%';
  ntext.innerHTML=s.note||'';
}
/* ---- rehearsal timer (T). Targets match RUN-CARD.md — 18 min total. ---- */
const TARGETS=[45,60,90,75,75,60,120,90,90,240,90,60,60,75,90];
const TOTAL=TARGETS.reduce((a,b)=>a+b,0);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let tOn=false,tStart=0,sStart=0,tTick=null;
function tickTimer(){
  const now=Date.now()/1000,el=now-tStart,sl=now-sStart,tgt=TARGETS[i]||60;
  document.getElementById('t_total').textContent=fmt(el)+' / '+fmt(TOTAL);
  const s=document.getElementById('t_slide');
  s.textContent='this slide '+fmt(sl)+' / '+fmt(tgt);
  s.className='ts'+(sl>tgt?' over':(sl>tgt*0.75?' near':''));
}
function toggleTimer(){
  tOn=!tOn;
  document.getElementById('timer').classList.toggle('show',tOn);
  if(tOn){tStart=sStart=Date.now()/1000;tickTimer();tTick=setInterval(tickTimer,1000);}
  else{clearInterval(tTick);tTick=null;}
}
function go(x){i=Math.max(0,Math.min(slides.length-1,x));notesEl.classList.remove('show');notesOpen=false;sStart=Date.now()/1000;render();if(tOn)tickTimer();}
document.getElementById('next').addEventListener('click',e=>{e.stopPropagation();go(i+1);});
document.getElementById('prev').addEventListener('click',e=>{e.stopPropagation();go(i-1);});
document.addEventListener('keydown',e=>{
  const t=(e.target.tagName||'').toLowerCase(),inF=t==='input'||t==='select'||t==='textarea';
  if(e.key.toLowerCase()==='n'&&!inF){notesOpen=!notesOpen;notesEl.classList.toggle('show',notesOpen);return;}
  if(e.key.toLowerCase()==='t'&&!inF){toggleTimer();return;}
  if(inF)return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
});
document.addEventListener('click',e=>{if(e.target.closest('input,select,button,label,a,.calc,.nav,#notes,.out'))return;go(e.clientX>window.innerWidth/2?i+1:i-1);});
render();
</script>
