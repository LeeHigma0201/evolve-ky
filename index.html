<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do you really need a panel upgrade? · ChargeRight × Evolve KY</title>
<meta name="description" content="Jason Walls — Evolve KY, July 26. Do you really need a panel upgrade for your EV charger? Usually not.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F1; --card:#FFFFFF; --ink:#171C2B; --soft:#525A6E; --faint:#8A91A2;
    --line:#E7E4DA; --line2:#DBD8CD;
    --blue:#1D5FE0; --blue-ink:#1A52C0; --green:#12986A; --amber:#C77D0A; --red:#D23B2E;
    --blue-wash:rgba(29,95,224,.13); --green-wash:rgba(18,152,106,.16);
    --sans:"DM Sans",system-ui,-apple-system,sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
    --r:14px;
    /* One scaling unit for the whole deck. Sized off whichever screen dimension is
       TIGHTER, so the deck fills a 16:9, 16:10 or 4:3 projector edge to edge without
       ever overflowing. Every former "Nvw" in this sheet is now calc(N*var(--s)). */
    --s:min(1.04vw,1.55vh);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--line) .9px, transparent .9px);background-size:26px 26px}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);width:0;transition:width .3s cubic-bezier(.4,0,.2,1);z-index:9}
  /* FULL BLEED — fills the projector, whatever its aspect ratio. No card, no letterbox. */
  .stage{position:relative;z-index:2;width:100vw;height:100vh;background:var(--card);
    background-image:radial-gradient(var(--line) .9px,transparent .9px);background-size:26px 26px;
    overflow:hidden}
  /* top padding clears the absolutely-positioned .brand so dense slides can't collide with it;
     bottom padding reserves the cue band + beat dots so revealing a beat never reflows the slide */
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:clamp(60px,9.6vh,112px) clamp(38px,calc(5.2*var(--s)),96px) clamp(112px,19vh,200px)}
  .slide.active{display:flex}
  .slide.active > *:not([data-r]):not(.cue):not(.dots){animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .slide.active > *:nth-child(2){animation-delay:.05s}
  .slide.active > *:nth-child(3){animation-delay:.1s}
  .slide.active > *:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* logo (top rule) */
  .brand{display:flex;align-items:center;gap:10px;position:absolute;top:clamp(26px,calc(4*var(--s)),40px);left:clamp(32px,calc(5.2*var(--s)),72px)}
  .brand .mark{width:26px;height:26px;color:var(--ink)}
  .brand .mark .bolt{fill:var(--blue)}
  .brand .wm{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .brand .wm b{color:var(--blue)}
  .kicker{font-family:var(--mono);font-size:clamp(10px,calc(1.2*var(--s)),18px);letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:0 0 clamp(14px,calc(2.2*var(--s)),20px);display:inline-flex;align-items:center;gap:10px}
  .kicker::before{content:"";width:22px;height:2px;background:var(--blue)}
  h1{font-weight:900;line-height:1.0;letter-spacing:-.035em;margin:0;font-size:clamp(34px,calc(6.4*var(--s)),104px);max-width:15ch}
  h2{font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:0;font-size:clamp(28px,calc(4.8*var(--s)),74px);max-width:17ch}
  .body{margin:clamp(16px,calc(2.3*var(--s)),24px) 0 0;font-size:clamp(17px,calc(2.2*var(--s)),34px);line-height:1.45;color:var(--soft);max-width:32ch}
  .body b{color:var(--ink);font-weight:700}
  /* highlighter — human, editorial emphasis (not gradient) */
  .hl{background:linear-gradient(120deg,var(--blue-wash),var(--blue-wash));box-shadow:0 0 0 3px var(--blue-wash);border-radius:3px;padding:0 .05em}
  .hl-g{background:var(--green-wash);box-shadow:0 0 0 3px var(--green-wash);border-radius:3px;padding:0 .05em}
  .u{background:linear-gradient(var(--blue),var(--blue)) bottom/100% .12em no-repeat;padding-bottom:.02em}
  .byline{margin-top:clamp(22px,calc(4*var(--s)),38px);font-family:var(--mono);font-size:clamp(12px,calc(1.5*var(--s)),22px);color:var(--soft)}
  .link{color:var(--blue);font-weight:700}
  .big{font-weight:900;letter-spacing:-.045em;line-height:.86;font-size:clamp(50px,calc(10.4*var(--s)),178px);color:var(--ink);margin:clamp(4px,calc(1*var(--s)),10px) 0}
  .caplabel{font-family:var(--mono);font-size:clamp(11px,calc(1.4*var(--s)),21px);letter-spacing:.02em;color:var(--faint);text-transform:uppercase}
  .foot{position:absolute;left:clamp(32px,calc(5.2*var(--s)),72px);bottom:clamp(24px,calc(3*var(--s)),30px);font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
  .count{position:absolute;right:clamp(32px,calc(5.2*var(--s)),72px);bottom:clamp(24px,calc(3*var(--s)),30px);font-family:var(--mono);font-size:12px;color:var(--soft)}
  .count b{color:var(--blue)}
  /* rehearsal timer — off by default, toggle with T */
  #timer{position:fixed;top:12px;right:14px;z-index:11;display:none;gap:12px;align-items:baseline;
    font-family:var(--mono);background:var(--card);border:1px solid var(--line2);border-radius:10px;
    padding:8px 13px;box-shadow:0 10px 26px -18px rgba(23,28,43,.7)}
  #timer.show{display:flex}
  #timer .tt{font-weight:700;color:var(--ink);font-size:14px}
  #timer .ts{font-size:11.5px;color:var(--soft)}
  #timer .ts.near{color:var(--amber);font-weight:700}
  #timer .ts.over{color:var(--red);font-weight:700}
  .nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:9}
  .nav button{font-family:var(--mono);font-size:15px;border:1px solid var(--line2);background:var(--card);color:var(--soft);width:42px;height:32px;border-radius:8px;cursor:pointer}
  .nav button:hover{border-color:var(--blue);color:var(--blue)}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:44vh;overflow:auto;z-index:10;background:var(--ink);color:#EBEEF5;
    border-top:3px solid var(--blue);padding:20px clamp(24px,calc(6*var(--s)),80px);font-size:15px;line-height:1.55;transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  #notes.show{transform:none}
  #notes .nlabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6ea0ff;margin-bottom:6px}
  /* title */
  .logo-lg{display:flex;align-items:center;gap:14px;margin-bottom:clamp(18px,calc(3*var(--s)),28px)}
  .logo-lg .mark{width:clamp(44px,calc(6*var(--s)),64px);height:clamp(44px,calc(6*var(--s)),64px);color:var(--ink)}
  .logo-lg .mark .bolt{fill:var(--blue)}
  .logo-lg .wm{font-size:clamp(24px,calc(3.6*var(--s)),36px);font-weight:900;letter-spacing:-.03em}
  .logo-lg .wm b{color:var(--blue)}
  /* houses (social proof) */
  .houses{display:flex;gap:clamp(6px,calc(1.4*var(--s)),16px);margin:clamp(12px,calc(2*var(--s)),20px) 0 clamp(6px,calc(1*var(--s)),12px);align-items:flex-end}
  .houses svg{width:clamp(40px,calc(7*var(--s)),124px);height:auto}
  .h-ok{color:var(--green)} .h-no{color:var(--red);opacity:.9}
  .houses .tag{font-family:var(--mono);font-size:clamp(12px,calc(1.3*var(--s)),19px);color:var(--faint);align-self:center;margin-left:6px}
  /* product steps */
  .steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:clamp(8px,calc(1.4*var(--s)),14px);margin-top:clamp(18px,calc(3*var(--s)),28px)}
  .step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(13px,calc(1.9*var(--s)),26px);text-align:center}
  .step .si{width:clamp(28px,calc(3.6*var(--s)),40px);height:clamp(28px,calc(3.6*var(--s)),40px);margin:0 auto 12px;color:var(--blue)}
  .step h4{margin:0 0 6px;font-size:clamp(15px,calc(1.8*var(--s)),29px);font-weight:800}
  .step p{margin:0;font-size:clamp(12px,calc(1.5*var(--s)),22px);color:var(--soft);line-height:1.35}
  .arrow{align-self:center;color:var(--line2);font-size:22px;font-family:var(--mono)}
  /* quote */
  .quote{margin:clamp(16px,calc(2.6*var(--s)),26px) 0 0;font-weight:800;line-height:1.24;letter-spacing:-.02em;font-size:clamp(23px,calc(3.5*var(--s)),58px);max-width:22ch;position:relative;padding-left:clamp(16px,calc(2*var(--s)),22px)}
  .quote::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:5px;border-radius:3px;background:var(--blue)}
  /* close + qr */
  .close{display:grid;grid-template-columns:1fr auto;gap:clamp(24px,calc(4*var(--s)),56px);align-items:center}
  .qrbox{background:#fff;padding:14px;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -24px rgba(23,28,43,.4)}
  .qrbox img{width:clamp(130px,calc(19*var(--s)),240px);height:auto;display:block}
  .qrcap{font-family:var(--mono);font-size:clamp(12px,calc(1.3*var(--s)),18px);color:var(--soft);text-align:center;margin-top:10px;max-width:22ch}
  /* ===== CALCULATOR — "how full is your panel" ===== */
  .calc{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(16px,calc(2.6*var(--s)),30px);align-items:stretch;margin-top:6px}
  .calc h2{font-size:clamp(21px,calc(2.9*var(--s)),30px);margin-bottom:12px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-family:var(--mono);font-size:clamp(10px,calc(1.1*var(--s)),16px);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .fld input,.fld select{font-family:var(--sans);font-size:clamp(16px,calc(1.75*var(--s)),26px);font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;width:100%;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
  .toggles{grid-column:1/3;display:flex;flex-wrap:wrap;gap:7px}
  .tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:20px;padding:6px 12px;cursor:pointer}
  .tog input{accent-color:var(--blue);width:15px;height:15px}
  .tog:has(input:checked){border-color:var(--blue);background:var(--blue-wash)}
  /* ===== teaching slides: code quotes, method cards, charger sizer ===== */
  .codeq{background:var(--paper);border-left:5px solid var(--blue);border-radius:0 10px 10px 0;
    padding:clamp(13px,calc(1.9*var(--s)),20px) clamp(15px,calc(2.2*var(--s)),24px);margin:clamp(12px,calc(1.8*var(--s)),18px) 0 0}
  .codeq q{font-family:var(--mono);font-size:clamp(12.5px,calc(1.55*var(--s)),27px);line-height:1.55;color:var(--ink);display:block;quotes:none}
  .codeq .src{font-family:var(--mono);font-size:clamp(10px,calc(1.1*var(--s)),16px);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:9px;display:block}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,calc(1.1*var(--s)),12px);margin-top:clamp(12px,calc(2*var(--s)),20px)}
  .mcard{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:clamp(11px,calc(1.5*var(--s)),16px);position:relative}
  .mcard.on{border-color:var(--green);border-width:2px;background:rgba(18,152,106,.07)}
  .mcard .mno{font-family:var(--mono);font-size:clamp(9.5px,calc(1.05*var(--s)),15px);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .mcard h4{margin:5px 0 5px;font-size:clamp(13px,calc(1.6*var(--s)),27px);font-weight:800;line-height:1.15}
  .mcard.on h4{color:var(--green)}
  .mcard p{margin:0;font-size:clamp(11px,calc(1.32*var(--s)),21px);color:var(--soft);line-height:1.35}
  .mcard .tag{position:absolute;top:-9px;right:9px;background:var(--green);color:#fff;font-family:var(--mono);
    font-size:9px;letter-spacing:.07em;padding:2px 7px;border-radius:20px;text-transform:uppercase}
  /* charger sizer */
  .szr{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(15px,calc(2.4*var(--s)),28px);margin-top:clamp(8px,calc(1.4*var(--s)),14px)}
  .chain{display:flex;flex-direction:column;gap:clamp(5px,.calc(8*var(--s)),9px)}
  .ch{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;padding:clamp(6px,calc(.85*var(--s)),13px) clamp(11px,calc(1.5*var(--s)),18px);
    background:var(--paper);border:1px solid var(--line);border-radius:9px}
  .ch .cl{font-family:var(--mono);font-size:clamp(10px,calc(1.2*var(--s)),19px);color:var(--soft);line-height:1.3}
  .ch .cv{font-weight:800;font-size:clamp(15px,calc(1.9*var(--s)),33px);letter-spacing:-.02em;white-space:nowrap}
  .ch.final{background:rgba(18,152,106,.10);border-color:rgba(18,152,106,.45)}
  .ch.final .cv{color:var(--green);font-size:clamp(19px,calc(2.6*var(--s)),45px)}
  .ch.nec{border-left:4px solid var(--blue)}
  .szrnote{font-family:var(--mono);font-size:clamp(10.5px,calc(1.15*var(--s)),17px);color:var(--faint);line-height:1.5;margin-top:9px}
  /* ===== video insert slides (NotebookLM clips) ===== */
  /* Portrait clip (NotebookLM Shorts are 9:16) beside the beats, so the 16:9
     frame is filled instead of letterboxing a skinny strip into black bars. */
  .vidwrap{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,calc(2.8*var(--s)),36px);
    align-items:center;margin-top:clamp(8px,calc(1.4*var(--s)),16px)}
  .vid{display:block;height:clamp(230px,47vh,430px);width:auto;max-width:calc(40*var(--s));
    border-radius:12px;border:1px solid var(--line2);background:#0B0F18;
    box-shadow:0 22px 44px -30px rgba(23,28,43,.8)}
  .vidfall{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,calc(2*var(--s)),22px)}
  .vf-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:9px}
  .vidbeats{margin:0;padding-left:19px;font-size:clamp(14px,calc(1.8*var(--s)),31px);line-height:1.45;color:var(--soft)}
  .vidbeats li{margin-bottom:clamp(7px,calc(1.1*var(--s)),12px)}
  .vidbeats li b{color:var(--ink);font-weight:700}
  .vidskip{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;margin-top:10px}
  @media (max-width:860px){ .vidwrap{grid-template-columns:1fr} .vid{max-width:100%;margin:0 auto} }
  /* ===== "this panel is full / it's barely working" ===== */
  .pnl{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,calc(3*var(--s)),38px);align-items:center;margin-top:clamp(10px,calc(1.6*var(--s)),18px)}
  .pbox{background:#EFEDE6;border:2px solid var(--line2);border-radius:10px;padding:10px 9px 8px;width:clamp(150px,calc(19*var(--s)),300px)}
  .pbox-h{font-family:var(--mono);font-size:clamp(9px,calc(1*var(--s)),14px);letter-spacing:.1em;color:var(--soft);text-align:center;margin-bottom:7px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 5px}
  .brk{display:block;background:var(--card);border:1px solid var(--line2);border-radius:2px;
    font-family:var(--mono);font-size:clamp(8.5px,calc(.95*var(--s)),14px);font-weight:700;color:var(--soft);text-align:center;padding:2.5px 0}
  .pbox-f{font-family:var(--mono);font-size:clamp(9px,calc(1*var(--s)),14px);color:var(--red);text-align:center;margin-top:7px;font-weight:700}
  .pbars{display:flex;flex-direction:column;gap:clamp(7px,calc(1.1*var(--s)),11px)}
  .pb{display:grid;grid-template-columns:clamp(96px,calc(13*var(--s)),150px) 1fr auto;gap:10px;align-items:center}
  .pb-l{font-family:var(--mono);font-size:clamp(9.5px,calc(1.15*var(--s)),19px);color:var(--soft);line-height:1.25}
  .pb-t{position:relative;height:clamp(17px,calc(2.3*var(--s)),40px);background:#EEEBE2;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
  .pb-f{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .pb-v{font-family:var(--mono);font-size:clamp(11px,calc(1.4*var(--s)),25px);font-weight:700;min-width:52px;text-align:right}
  .pb-lim{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);z-index:2}
  .pb-limcap{font-family:var(--mono);font-size:clamp(9px,calc(1*var(--s)),15px);color:var(--soft);position:absolute;top:-15px;transform:translateX(-50%);white-space:nowrap}
  .limrow{position:relative;height:14px}
  .miles{font-family:var(--mono);font-size:clamp(15px,calc(1.6*var(--s)),24px);font-weight:700;color:var(--green);padding-top:9px}
  .cite{grid-column:1/3;font-family:var(--mono);font-size:clamp(10.5px,calc(1.15*var(--s)),17px);color:var(--faint);line-height:1.5}
  .out{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,calc(2.2*var(--s)),24px);display:flex;flex-direction:column;gap:12px}
  .rowtop{display:flex;align-items:baseline;gap:10px}
  .rowtop .amps{font-weight:900;font-size:clamp(42px,calc(6.6*var(--s)),96px);letter-spacing:-.04em;line-height:.85;color:var(--ink)}
  .rowtop .of{font-family:var(--mono);font-size:clamp(13px,calc(1.4*var(--s)),21px);color:var(--soft)}
  .rowtop .util{margin-left:auto;font-family:var(--mono);font-size:clamp(13px,calc(1.4*var(--s)),21px);color:var(--soft)}
  .meter{position:relative;height:clamp(40px,calc(4.6*var(--s)),64px);border-radius:9px;overflow:hidden;background:#EEEBE2;border:1px solid var(--line2)}
  .zones{position:absolute;inset:0;display:flex}
  .z-g{background:rgba(18,152,106,.16)} .z-a{background:rgba(199,125,10,.18)} .z-r{background:rgba(210,59,46,.18)}
  .fill{position:absolute;top:6px;bottom:6px;left:6px;display:flex;border-radius:6px;overflow:hidden;transition:width .5s cubic-bezier(.3,.7,.2,1);max-width:calc(100% - 12px)}
  .f-exist{background:var(--blue)} .f-ev{background:var(--green)}
  .limit{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);transition:left .5s}
  .limit::after{content:"your limit";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--soft);white-space:nowrap}
  .legend{display:flex;gap:16px;font-family:var(--mono);font-size:clamp(11.5px,calc(1.25*var(--s)),18px);color:var(--soft);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .verdict{border-radius:11px;padding:13px 15px;font-weight:800;font-size:clamp(16px,calc(1.9*var(--s)),33px);line-height:1.2;border:1px solid}
  .verdict small{display:block;font-family:var(--mono);font-weight:400;font-size:clamp(12px,calc(1.3*var(--s)),19px);margin-top:6px;opacity:.95;letter-spacing:.01em}
  .v-comfortable{background:rgba(18,152,106,.10);color:var(--green);border-color:rgba(18,152,106,.4)}
  .v-tight{background:rgba(199,125,10,.10);color:var(--amber);border-color:rgba(199,125,10,.4)}
  .v-exceeds{background:rgba(210,59,46,.09);color:var(--red);border-color:rgba(210,59,46,.4)}
  /* ===== BEATS — one spacebar tap reveals one piece =====
     Hidden beats keep their space in the layout (opacity, not display), so nothing
     on screen jumps or reflows as pieces land. Anything without data-b is always up. */
  [data-b]{opacity:0;transform:translateY(13px);
    transition:opacity .4s cubic-bezier(.2,.7,.2,1),transform .4s cubic-bezier(.2,.7,.2,1)}

  /* the cue line — the sentence Jason reads, and the room reads with him */
  /* Cue and beat dots share one flex band, so the sentence and the step counter can
     never collide no matter how long either gets or how narrow the screen is. */
  .cband{position:absolute;left:0;right:0;bottom:clamp(44px,8vh,96px);
    padding:0 clamp(38px,calc(5.2*var(--s)),96px);display:flex;align-items:flex-end;
    gap:clamp(16px,calc(2.4*var(--s)),44px);pointer-events:none}

    border-left:5px solid var(--blue);padding-left:clamp(14px,calc(1.8*var(--s)),24px);
    animation:cuein .36s cubic-bezier(.2,.7,.2,1) both}

  .cue p .qt{color:var(--soft);font-weight:600}
  @keyframes cuein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  /* beat dots — how many taps are left on this slide */
  .dots{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding-bottom:.3em;white-space:nowrap}
  .dots i{width:clamp(14px,calc(1.7*var(--s)),26px);height:5px;border-radius:3px;
    background:var(--line2);transition:background .3s}
  .dots i.on{background:var(--blue)}
  .dots .dl{font-family:var(--mono);font-size:clamp(9.5px,calc(1.05*var(--s)),12.5px);
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-left:9px}
  .dots .dl.last{color:var(--blue);font-weight:700}
  /* revealed checklist / point stack (the text-only teaching slides) */
  /* Flows into two columns as soon as there's width for it — a five-point checklist
     is far too tall for a projector in one column. */
  .bitlist{list-style:none;margin:clamp(16px,calc(2.4*var(--s)),34px) 0 0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,27ch),1fr));
    gap:clamp(9px,calc(1.2*var(--s)),16px) clamp(20px,calc(3*var(--s)),52px);max-width:64ch}
  .bitlist li{position:relative;padding-left:clamp(26px,calc(3*var(--s)),46px);
    font-size:clamp(17px,calc(2.05*var(--s)),30px);font-weight:700;line-height:1.24;
    letter-spacing:-.015em;color:var(--ink)}
  .bitlist li::before{content:"";position:absolute;left:0;top:.36em;
    width:clamp(13px,calc(1.45*var(--s)),22px);height:clamp(13px,calc(1.45*var(--s)),22px);
    border-radius:50%;background:var(--blue-wash);box-shadow:inset 0 0 0 3px var(--blue)}
  .bitlist li b{color:var(--blue-ink)}
  .bitlist li i{display:block;font-style:normal;font-weight:500;font-size:.62em;
    color:var(--soft);margin-top:.28em;line-height:1.35}
  /* speaker notes, built from the beats so they can't drift from the screen */
  #notes .nbeat{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:9px 10px 9px 0;
    border-top:1px solid rgba(235,238,245,.1)}
  #notes .nbeat:first-child{border-top:none}
  #notes .nbeat.now{background:rgba(110,160,255,.13);border-radius:7px;padding-left:10px}
  #notes .nbeat .nb{grid-row:1/3;font-family:var(--mono);font-size:11px;color:#6ea0ff;
    padding-top:3px;min-width:16px}
  #notes .nbeat b{font-weight:700;color:#fff}
  #notes .nbeat i{font-style:normal;color:#AEBACF;font-size:13.5px;line-height:1.5}
  #notes .nextra{margin-top:13px;padding-top:11px;border-top:2px solid rgba(110,160,255,.42);
    color:#AEBACF;font-size:13.5px}
  /* ===== PRE-SHOW LOOP — runs while the room fills in ===== */
  #pre{position:fixed;inset:0;z-index:20;display:none;background:var(--ink);color:#F2F5FA;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:clamp(28px,calc(4*var(--s)),70px);overflow:hidden;cursor:pointer}
  #pre.show{display:flex}
  #pre::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:var(--blue);
    animation:sweep 9s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes sweep{0%{width:0;opacity:.35}70%{width:100%;opacity:1}100%{width:100%;opacity:0}}
  #pre .pmark{width:clamp(72px,calc(9.5*var(--s)),150px);height:auto;color:#F2F5FA;

  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes zap{0%,100%{opacity:.55}50%{opacity:1}}
  #pre .pwm{font-size:clamp(26px,calc(4*var(--s)),58px);font-weight:900;letter-spacing:-.03em;
    margin-top:clamp(12px,calc(1.8*var(--s)),24px)}
  #pre .pwm b{color:#5B95FF}
  #pre h2{color:#fff;max-width:26ch;margin:clamp(16px,calc(2.4*var(--s)),34px) auto 0;
    font-size:clamp(24px,calc(3.9*var(--s)),64px);text-wrap:balance}
  #pre .phl{background:rgba(91,149,255,.22);box-shadow:0 0 0 4px rgba(91,149,255,.22);border-radius:4px}
  #pre .tick{position:relative;height:clamp(58px,calc(7.4*var(--s)),110px);width:min(90vw,42ch);
    margin:clamp(18px,calc(2.6*var(--s)),34px) auto 0}
  #pre .tick span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,calc(2.15*var(--s)),33px);font-weight:700;line-height:1.3;color:#C9D4E8;
    opacity:0;animation:tick 20s cubic-bezier(.2,.7,.2,1) infinite}
  #pre .tick span .tl{display:block;text-align:center;font-style:normal}
  #pre .tick span em{color:#fff;font-style:normal}
  #pre .tick span:nth-child(1){animation-delay:0s}
  #pre .tick span:nth-child(2){animation-delay:5s}
  #pre .tick span:nth-child(3){animation-delay:10s}
  #pre .tick span:nth-child(4){animation-delay:15s}
  @keyframes tick{0%{opacity:0;transform:translateY(12px)}
    3%{opacity:1;transform:none}22%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-10px)}
    100%{opacity:0;transform:translateY(-10px)}}
  #pre .pfoot{margin-top:clamp(20px,calc(3*var(--s)),40px);display:flex;align-items:center;
    gap:clamp(16px,calc(2.4*var(--s)),34px);flex-wrap:wrap;justify-content:center}
  #pre .pqr{background:#fff;padding:10px;border-radius:12px}
  #pre .pqr img{display:block;width:clamp(74px,calc(9*var(--s)),128px);height:auto}
  #pre .pmeta{font-family:var(--mono);font-size:clamp(11px,calc(1.35*var(--s)),16px);
    line-height:1.7;color:#9FB0CC;text-align:left}
  #pre .pmeta b{color:#fff}
  #pre .ptap{position:absolute;bottom:clamp(16px,calc(2.2*var(--s)),28px);left:0;right:0;
    font-family:var(--mono);font-size:clamp(9.5px,calc(1.05*var(--s)),12.5px);letter-spacing:.16em;
    text-transform:uppercase;color:#5E6B84}
  @media (max-width:860px){ .calc,.close{grid-template-columns:1fr} .steps{grid-template-columns:1fr} .arrow{transform:rotate(90deg)} }

<body>

<script>
const MARK=`<svg class="mark" viewBox="0 0 120 120" fill="none"><path d="M60 15 L101 46 V95 a7 7 0 0 1-7 7 H26 a7 7 0 0 1-7-7 V46 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path class="bolt" d="M66 38 L40 72 H57 L52 94 L82 56 H63 Z"/></svg>`;
const WORD=`<span class="wm">Charge<b>Right</b></span>`;
const IC={
  camera:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>`,
  calc:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2m3 0h3M8 14h2m3 0h3M8 18h2m3 0h3"/></svg>`,
  check:`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>`
};
const HOUSE=c=>`<svg class="${c}" viewBox="0 0 120 120" fill="none"><path d="M60 15 L101 46 V95 a7 7 0 0 1-7 7 H26 a7 7 0 0 1-7-7 V46 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path d="M66 40 L42 70 H57 L52 90 L80 58 H62 Z" fill="currentColor"/></svg>`;

/* ---- PRE-SHOW LOOP ----
   On screen while people find seats. Four lines cycle on a 20 s loop; the QR is up the
   whole time so anyone can scan before he says a word. No mp4 — CSS only, so it can't
   fail to decode and it needs no network. Tap / space / arrow starts the talk. ---- */
const PRE=`<svg class="pmark" viewBox="0 0 120 120" fill="none"><path d="M60 15 L101 46 V95 a7 7 0 0 1-7 7 H26 a7 7 0 0 1-7-7 V46 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><path class="bolt" d="M66 38 L40 72 H57 L52 94 L82 56 H63 Z"/></svg>
  <div class="pwm">Charge<b>Right</b></div>
  <h2>Do you really need a <span class="phl">panel upgrade</span> for your EV charger?</h2>
  <div class="tick">
    <span><i class="tl"><em>410 amps</em> of breakers on a 200 amp service &mdash; and nothing ever trips.</i></span>
    <span><i class="tl">Four legal ways to run the math. <em>Only one</em> was written for your house.</i></span>
    <span><i class="tl">In the homes I&rsquo;ve checked, <em>4 out of 5</em> already had the room.</i></span>
    <span><i class="tl">Charge at what you need &mdash; <em>not</em> what the box says it can do.</i></span>
  </div>
  <div class="pfoot">
    <div class="pqr"><img src="qr.svg" alt="QR to evchargeright.com"></div>
    <div class="pmeta"><b>Jason Walls</b> &middot; Master Electrician<br>IBEW Local 369 &middot; Louisville<br><b>evchargeright.com</b></div>
  </div>
  <div class="ptap">Evolve Kentucky &middot; starting shortly &mdash; tap to begin</div>`;

const slides=[
  { type:"title",
    note:"COLD OPEN — say it, don't read it:<br><br>&ldquo;Show of hands &mdash; who&rsquo;s heard of the <b>Tesla tax</b>?&rdquo; <i>(hands)</i><br>&ldquo;Now &mdash; not the one on your registration. That one&rsquo;s a hundred and some-odd bucks a year and there&rsquo;s nothing I can do about it.&rdquo; <i>(laugh)</i><br>&ldquo;I mean the other one. Where you mention you&rsquo;re getting an EV, and the number goes up. <b>Keep your hand up</b> if you&rsquo;ve been quoted to upgrade your panel.&rdquo; <i>(hands)</i><br>&ldquo;Three grand? Four?&rdquo; <i>(beat)</i><br>&ldquo;<b>That&rsquo;s the Tesla tax. And by the time you leave here, you&rsquo;ll know how to tell whether you actually owe it.</b>&rdquo;<br><br>Don&rsquo;t pause after the first question &mdash; in KY they&rsquo;ll think you mean the registration fee. Define it in the same breath." },
  { label:"Who I am", head:"I&rsquo;m Jason. <span class='u'>IBEW Local 369.</span>",
    body:"Union electrician, right here. I run these load calculations for a living &mdash; and in the next twenty minutes I&rsquo;m going to teach you how to run one on your own house.",
    note:"AUTHORITY THROUGH COMPETENCE, not through distance from selling. You're not here to pitch — you're the guy in the room who actually knows the math, and you're giving it away.<br><br>SAY IT PLAIN: &ldquo;I'm a union electrician, Local 369, right here. I do this math every day. And I'm going to show you how to do it.&rdquo;<br><br>THE PROMISE IS THE HOOK. They came to learn something. Tell them exactly what they'll leave knowing.<br><br>(Save 'I don't do installs' for Q&A — it's a great answer to 'what's your angle,' but leading with it makes this about selling. This talk isn't.)" },
  { type:"anchor", label:"What&rsquo;s at stake", head:"You bought the car. Then came the quote.",
    big:"$3,000&ndash;$5,000", caplabel:"what an installer quotes to &ldquo;upgrade your panel&rdquo; first",
    body:"By the time you leave here you&rsquo;ll know whether you <span class='hl-g'>actually owe it.</span>",
    note:"THE STAKES, not a sales anchor. Let the number sit three full seconds — this is what it costs to be wrong.<br><br>THEN THE BEAT BUILT FOR THIS ROOM: &ldquo;And here's the part that ought to bother everybody in here &mdash; some people get that quote and they just don't buy the car.&rdquo;<br><br>That makes you an ally of what this club exists for, not a vendor. It's why they'll pass it on.<br><br>THEN THE PROMISE: &ldquo;So let's learn how to tell.&rdquo; That's the transition into the whole lesson." },
  { label:"Start here", head:"Your panel is <span class='u'>barely working.</span>",
    body:"Your house almost never runs everything at once. And your EV charges <b>overnight</b> &mdash; while the oven, dryer, and AC are all off. That&rsquo;s the room most people already have. (A charger&rsquo;s about like adding an electric range.)",
    note:"THE AHA / MENTAL MODEL. The comprehension unlock. Slow down here — this is the most important 30 seconds in the talk.<br><br>OPEN BY KILLING THE MYTH: &ldquo;Everybody opens their panel, sees no empty slots, and figures it's full. Slots aren't capacity. Counting breakers isn't the math &mdash; that panel could be half asleep.&rdquo;<br><br>THEN: your house never runs everything at once, and the car charges at 2 AM when all of it is off.<br><br>BUTTON IT: &ldquo;Your panel is barely working, and your car charges while you're asleep. That's the whole thing.&rdquo; Say that slower than feels natural &mdash; it's the sentence you want them repeating." },
  { type:"panelmyth", label:"The myth that sells the upgrade",
    head:"This panel is <span class='hl'>full.</span> It isn&rsquo;t close to loaded.",
    note:"THE MYTH, KILLED WITH ONE PICTURE. Point at the panel: &ldquo;No open slots. Every installer who opens this says the same thing &mdash; you're full, you need an upgrade.&rdquo;<br><br>Then the red bar: &ldquo;Add up every number printed on those breakers and you get <b>410 amps</b> on a 200 amp service. And nothing trips. Nothing's ever tripped.&rdquo;<br><br>Then the green bars: &ldquo;Here's the same house run three different legal ways in the code book. A hundred and thirteen. A hundred and twenty-seven. A hundred and forty-one. <b>All three fit.</b>&rdquo;<br><br>THE LINE: &ldquo;<b>Adding up breakers was never the load calculation. It just looks like one &mdash; and it's how upgrades get sold.</b>&rdquo;<br><br>If an electrician asks: all three include the 48 A charger at 100%, no demand factor, per the 2023 EVSE rule. Same house, same charger, three legal methods." },
  { type:"methods", label:"Lesson one", head:"There is more than one legal way to run it.",
    body:"Three of these are <b>estimates</b>. One of them <b>measures</b>. And only one of them was written for your situation &mdash; a house that already exists, taking on one more load.",
    note:"THE CORE LESSON. Most people &mdash; including plenty of electricians &mdash; think there's one load calculation. There isn't.<br><br>WALK THE FOUR, one sentence each:<br>&bull; <b>Standard, Part III</b> &mdash; rebuilds the house circuit by circuit. That's the calc for a house being BUILT.<br>&bull; <b>220.82</b> &mdash; the whole-house shortcut. Fine, but it's a sizing calc, and it needs 100 amp service or bigger.<br>&bull; <b>220.83</b> &mdash; existing house, adding a load. <b>That's you.</b><br>&bull; <b>220.87</b> &mdash; don't estimate at all. Use what the house actually pulled.<br><br>THE HONEST BEAT: &ldquo;Here's the thing &mdash; a lot of guys quoting you have never run any of these. They counted your breakers. That's not one of the four.&rdquo;<br><br>Say that without sneering. You're not attacking the trade, you're explaining why quotes disagree." },
  { type:"codeq", label:"Lesson two", head:"220.83 &mdash; the one that&rsquo;s yours.",
    body:"Existing house, adding one more thing. <b>First 8 kVA at 100%, everything after that at 40%.</b> That&rsquo;s the whole method. Read what the code says it&rsquo;s for &mdash; it&rsquo;s the first line.",
    quote:"This section shall be permitted to be used to determine if the existing service or feeder is of sufficient capacity to serve additional loads.",
    src:"NEC 220.83, Existing Dwelling Unit &mdash; 2017 text; Kentucky is on 2023",
    note:"READ THE QUOTE OUT LOUD, SLOWLY. Then translate it: &ldquo;Existing service. Additional load. That is a house with an EV charger going in. The code has a section written for exactly this, and most people never use it.&rdquo;<br><br>THE UNIT, in one breath: &ldquo;a kVA is just a thousand watts &mdash; so the first 8,000 watts of your house counts in full, and everything past that counts at 40 cents on the dollar.&rdquo;<br><br>THE (A)/(B) POINT, if anyone asks: (A) is when you're NOT also installing new AC or electric heat. (B) is when you are. <b>It's about what you're putting IN, not what the house already has.</b> A charger by itself is (A).<br><br>HONESTY: say &ldquo;this is the 2017 wording &mdash; we're on 2023 in Kentucky and these sections read the same, but I'm quoting the copy I can legally hand you.&rdquo; That sentence buys you more credibility than anything else in the talk." },
  { type:"codeq", label:"Lesson three", head:"Or don&rsquo;t estimate at all.",
    body:"Your utility already knows what your house actually pulled. There&rsquo;s a section that lets you use <b>real measured demand</b> instead of adding up nameplates &mdash; and real numbers beat assumed numbers every time.",
    quote:"The calculation of a feeder or service load for existing installations shall be permitted to use actual maximum demand&hellip; The maximum demand at 125 percent plus the new load does not exceed the ampacity of the feeder or rating of the service.",
    src:"NEC 220.87, Determining Existing Loads &mdash; 2017 text, conditions abridged; Kentucky is on 2023",
    note:"THE ONE NOBODY TEACHES. This is the slide that makes electricians in the room sit up.<br><br>PLAIN ENGLISH: &ldquo;Take the highest your house has actually pulled. Multiply by one-two-five. Add the charger. If that's under your service rating, you're done &mdash; and you never estimated anything.&rdquo;<br><br>HOW THEY GET IT: a year of demand data from the utility, or thirty days on a recording meter with the house occupied and the heating or cooling running. The code even defines the peak as the highest 15-minute average &mdash; which is exactly the interval utilities already report.<br><br>WHY IT MATTERS: estimating adds up every nameplate as if you might run it all. Measuring uses what you really did. It's very often the difference between 'you need an upgrade' and 'you're fine.'" },
  { type:"video", label:"Watch it happen", head:"The same house, three legal ways.",
    src:"video-methods.mp4",
    fallback:["<b>410 amps</b> of breakers on a 200 amp service &mdash; and nothing ever trips.",
      "Standard method: <b>141 A</b>. Optional 220.82: <b>127 A</b>. Existing dwelling 220.83(A): <b>113 A</b>.",
      "Every real method says it fits. Only the fake one says it doesn&rsquo;t."],
    note:"YOUR BREATHER. Let it play. Don't talk over it &mdash; step to the side, take a drink of water, and read your next three lines.<br><br>WHEN IT ENDS, one sentence and move: &ldquo;That's three different legal ways to run it, and all three say the same thing.&rdquo; Then straight into the live calculator.<br><br>IF IT DOESN'T PLAY: the bullets on screen ARE your script. Say them and advance. Never debug on stage.<br><br>CUTTABLE &mdash; if you're at 15 minutes, skip this and slide 12." },
  { type:"calc", label:"See it for a real house",
    head:"How full is your panel &mdash; really?",
    note:"Now they GET it, so show it. Ask for a real house in the room and fill it in. The bar shows how full they already are, the green is the EV on top, the line is their limit. Watch the money land in the verdict.<br><br>NAME THE METHOD while the cite&rsquo;s on screen: &ldquo;This gauge runs 220.82 &mdash; the stricter estimate. Same house: this one reads 127 where 220.83 reads 113. If you fit under the strict one, there&rsquo;s no argument.&rdquo;" },
  { type:"sizer", label:"Lesson four", head:"Size the charger to your <span class='u'>driving</span> &mdash; not to the box it came in.",
    note:"THIS IS YOUR LESSON. Nobody else in that room has heard it, and it's the one they'll repeat.<br><br>THE SETUP: &ldquo;Everybody sells you the biggest charger on the shelf. But the charger doesn't care what it CAN do &mdash; it matters what you actually need. And two things set that: how far you drive, and how long the car sits in your driveway.&rdquo;<br><br>DO IT LIVE. Start on the defaults (35 miles, 8 hours). Then change ONE thing at a time:<br>&bull; Bump miles to 60 &mdash; <b>the breaker doesn't move.</b> Say that out loud. Then the why, pointing at the chain: &ldquo;double the miles spread over a night&rsquo;s sleep is still only about eleven amps &mdash; less than the smallest setting a charger even offers. It <i>can&rsquo;t</i> move.&rdquo;<br>&bull; Now drop hours from 8 to 4 &mdash; <b>now</b> it moves. &ldquo;Same driver. Same car. Same miles. The only thing that changed is how long it's plugged in.&rdquo;<br>&bull; Switch the car to the truck &mdash; watch it climb.<br><br>THE LINE: &ldquo;<b>Hours are the lever. Not the badge on the box.</b>&rdquo;<br><br>HONESTY BEAT: &ldquo;The breaker line is code and it's exact. Everything above it is arithmetic, and your miles-per-kWh is a guess until you check your own car.&rdquo;<br><br>If asked why a 'plug-in 50 amp charger' is really 40: the code makes EV charging a continuous load, so you only get 80% of the circuit &mdash; and receptacles cap at 50 amps, which is why 48 A has to be hardwired." },
  { type:"video", label:"One more thing", head:"You may not need the big charger either.",
    src:"video-howitworks.mp4",
    fallback:["<b>16 amps</b> overnight puts back about <b>105 miles</b>. The average person drives <b>37</b>.",
      "Same house on a 100 A service: at 48 A it&rsquo;s <b>127 A &mdash; over</b>. At 16 A it&rsquo;s <b>95 A &mdash; it fits</b>.",
      "You don&rsquo;t have a panel problem. You&rsquo;ve got a charger you didn&rsquo;t need."],
    note:"SECOND BREATHER, right before the ask &mdash; and the answer for the one-in-five.<br><br>Everybody sells the biggest charger on the shelf. This is the slide that saves the people who came in expecting bad news.<br><br>WHEN IT ENDS: &ldquo;<b>You don't have a panel problem. You've got a charger you didn't need.</b>&rdquo; Then straight to the ask.<br><br>IF IT DOESN'T PLAY: the three bullets are the script. You can also just go back to slide 10 and turn the amps down live &mdash; that demo works with no video at all.<br><br>CUTTABLE &mdash; but this one earns its place if you have the time." },

function computeCalc(){
  const n=id=>parseFloat(document.getElementById(id).value)||0,ck=id=>document.getElementById(id).checked;
  const sqft=n('c_sqft'),panel=n('c_panel'),acTons=n('c_ac'),heatKW=n('c_heat'),evAmps=n('c_ev');
  let fixed=0; if(ck('c_range'))fixed+=8000; if(ck('c_dryer'))fixed+=5000; if(ck('c_wh'))fixed+=4500; if(ck('c_tub'))fixed+=6000;
  const before=sqft*3+2*1500+1*1500+fixed;
  const demand=Math.min(10000,before)+Math.max(0,before-10000)*0.4;
  const hvac=Math.max(acTons*1200,heatKW*1000*0.65);
  const existingA=(demand+hvac)/240,totalA=(demand+hvac+evAmps*240)/240;
  const safe=panel*0.8,status=totalA<=safe?'comfortable':(totalA<=panel?'tight':'exceeds');
  const headroom=Math.max(0,panel-totalA),util=panel?totalA/panel*100:0;
  const R=x=>Math.round(x).toLocaleString();
  /* range added over an 8-hour night, ~3.5 mi/kWh — the "you need less than you think" lever */
  document.getElementById('c_miles').textContent='≈ '+R(evAmps*240/1000*8*3.5)+' mi';
  document.getElementById('c_amps').textContent=R(totalA)+' A';
  document.getElementById('c_of').textContent='of '+R(panel)+' A service';
  document.getElementById('c_util').textContent=Math.round(util)+'% used';
  const scale=Math.max(panel,totalA)*1.08,p=x=>Math.min(100,x/scale*100);
  document.getElementById('z_g').style.width=p(panel*0.8)+'%';
  document.getElementById('z_a').style.width=(p(panel)-p(panel*0.8))+'%';
  document.getElementById('z_r').style.width=(100-p(panel))+'%';
  document.getElementById('c_fill').style.width=p(totalA)+'%';
  const tot=Math.max(p(totalA),0.001);
  document.getElementById('f_exist').style.width=(p(existingA)/tot*100)+'%';
  document.getElementById('f_ev').style.width=((p(totalA)-p(existingA))/tot*100)+'%';
  document.getElementById('c_limit').style.left=p(panel)+'%';
  const msg={
    comfortable:['&#10003; You&rsquo;ve got room. No upgrade needed.','That&rsquo;s '+R(headroom)+' A to spare &mdash; and likely a few thousand dollars you keep.'],
    tight:['It fits &mdash; but it&rsquo;s tight.','Only '+R(headroom)+' A left. Load management is the smart, cheaper fix (not a whole new panel).'],
    exceeds:['This one really does need attention.','You&rsquo;re past the limit &mdash; the ~1 in 5 where an upgrade or load management is honest advice.']
  }[status];
  document.getElementById('c_verdict').innerHTML=`<div class="verdict v-${status}">${msg[0]}<small>${msg[1]}</small></div>`;
}

  else if(s.type==='product') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><div class="steps"><div class="step" data-r="step1">${IC.calc}<h4>1 · Pick your car</h4><p>And the charger you want.</p></div><div class="arrow">→</div><div class="step" data-r="step2">${IC.camera}<h4>2 · Snap your panel</h4><p>It runs the NEC 220.82 calc.</p></div><div class="arrow">→</div><div class="step" data-r="step3">${IC.check}<h4>3 · Get the report</h4><p>Plain English. Hand it to any contractor.</p></div></div><p class="body" style="max-width:42ch"${R(s,'body')}>${s.body} <span class="link">evchargeright.com</span></p>`;
  else if(s.type==='quote') inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2><p class="quote"${R(s,'quote')}>&ldquo;${s.quote}&rdquo;</p>`;
  else if(s.type==='close') inner=`<p class="kicker">${s.label}</p><div class="close"><div><h2>${s.head}</h2><p class="body"${R(s,'body')}>${s.body}</p><p class="byline"${R(s,'byline')}>Get it at <span class="link">${s.url}</span> &mdash; $12.99<br>or <b>ChargeRight</b> on the <span class="link">App Store</span>, free to download</p></div><div${R(s,'qr')}><div class="qrbox"><img src="qr.svg" alt="QR to evchargeright.com"></div><div class="qrcap">Scan it — or text it to someone about to buy an EV</div></div></div>`;
  else inner=`<p class="kicker">${s.label}</p><h2>${s.head}</h2>`+bitsMarkup(s)+(s.body?`<p class="body"${R(s,'body')}>${s.body}</p>`:'');

  const head=(s.type==='title')?`<div class="foot">space next · ← back · N notes · T timer · P pre-show</div><div class="count"><b>01</b> / ${slides.length}</div>`:chrome();
  stage.innerHTML=`<section class="slide active">${head}${inner}<div class="cband"><div class="cue" id="cue"></div><div class="dots" id="dots"></div></div></section>`;
  if(s.type==='calc') wireCalc();
  else if(s.type==='sizer') wireSizer();
  else if(s.type==='video') wireVideo();
  paint();
  bar.style.width=(i/(slides.length-1)*100)+'%';
  ntext.innerHTML=noteFor(s);
}
/* Paint the current beat: light up everything up to it, swap the cue, redraw the dots. */
function paint(){
  const s=slides[i],bs=beatsOf(s),n=bs.length;
  b=Math.max(1,Math.min(n,b));
  const at={}; bs.forEach((bt,k)=>{ if(bt.reveal&&bt.reveal!=='none'&&!(bt.reveal in at)) at[bt.reveal]=k+1; });
  stage.querySelectorAll('[data-r]').forEach(el=>{
    const k=at[el.dataset.r];
    if(k){el.setAttribute('data-b',k);el.classList.toggle('lit',k<=b);}
    else{el.removeAttribute('data-b');el.classList.add('lit');}
  });
  const cue=document.getElementById('cue');
  if(cue) cue.innerHTML=bs[b-1].line?`<p>${bs[b-1].line}</p>`:'';
  const dots=document.getElementById('dots');
  if(dots){
    const last=b>=n;
    dots.innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<b?'on':''}"></i>`).join('')+
      `<span class="dl${last?' last':''}">${last?(i<slides.length-1?'next ▸ '+(i+2):'end'):b+' of '+n}</span>`;
  }
}
/* The speaker note is built from the beats, so the note panel and the audio track can
   never drift from what's actually on screen. */
function noteFor(s){
  const bs=beatsOf(s);
  if(!s.beats||!s.beats.length) return s.note||'';
  return bs.map((bt,k)=>`<div class="nbeat${k+1===b?' now':''}"><span class="nb">${k+1}</span><b>${bt.line}</b>${bt.say?`<i>${bt.say}</i>`:''}</div>`).join('')
    +(s.note?`<div class="nextra">${s.note}</div>`:'');
}
/* ---- rehearsal timer (T). Targets match RUN-CARD.md — 24:30 total. ---- */
const TARGETS=[45,60,75,90,90,105,85,85,90,180,150,60,50,75,80,60,90];
const TOTAL=TARGETS.reduce((a,b)=>a+b,0);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let tOn=false,tStart=0,sStart=0,tTick=null;
function tickTimer(){
  const now=Date.now()/1000,el=now-tStart,sl=now-sStart,tgt=TARGETS[i]||60;
  document.getElementById('t_total').textContent=fmt(el)+' / '+fmt(TOTAL);
  const s=document.getElementById('t_slide');
  s.textContent='this slide '+fmt(sl)+' / '+fmt(tgt);
  s.className='ts'+(sl>tgt?' over':(sl>tgt*0.75?' near':''));
}
function toggleTimer(){
  tOn=!tOn;
  document.getElementById('timer').classList.toggle('show',tOn);
  if(tOn){tStart=sStart=Date.now()/1000;tickTimer();tTick=setInterval(tickTimer,1000);}
  else{clearInterval(tTick);tTick=null;}
}
/* atEnd: when stepping BACKWARD into a slide, land on its last beat so the slide is
   fully revealed — going back should never blank out what the room already saw. */
function go(x,atEnd){
  const t=Math.max(0,Math.min(slides.length-1,x));
  if(t===i&&!atEnd){paint();return;}
  i=t;b=atEnd?beatsOf(slides[i]).length:1;
  notesEl.classList.remove('show');notesOpen=false;sStart=Date.now()/1000;
  render();if(tOn)tickTimer();
}
/* One tap = one beat. Only when the slide's beats run out does it move on. */
function step(d){
  const n=beatsOf(slides[i]).length;
  if(d>0){ if(b<n){b++;paint();if(notesOpen)ntext.innerHTML=noteFor(slides[i]);} else go(i+1); }
  else{ if(b>1){b--;paint();if(notesOpen)ntext.innerHTML=noteFor(slides[i]);} else if(i>0) go(i-1,true); }
}
/* ---- pre-show loop ---- */
const preEl=document.getElementById('pre');
preEl.innerHTML=PRE;
const preOn=()=>preEl.classList.contains('show');
function showPre(on){preEl.classList.toggle('show',on);}
preEl.addEventListener('click',()=>showPre(false));
document.getElementById('next').addEventListener('click',e=>{e.stopPropagation();if(preOn()){showPre(false);return;}step(1);});
document.getElementById('prev').addEventListener('click',e=>{e.stopPropagation();if(preOn()){showPre(false);return;}step(-1);});
document.addEventListener('keydown',e=>{
  const t=(e.target.tagName||'').toLowerCase(),inF=t==='input'||t==='select'||t==='textarea';
  if(e.key.toLowerCase()==='p'&&!inF){showPre(!preOn());return;}
  if(preOn()){ if(e.key===' '||e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Enter'||e.key==='Escape'){e.preventDefault();showPre(false);} return; }
  if(e.key.toLowerCase()==='n'&&!inF){notesOpen=!notesOpen;notesEl.classList.toggle('show',notesOpen);return;}
  if(e.key.toLowerCase()==='t'&&!inF){toggleTimer();return;}
  if(inF)return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();go(i+1);}   /* skip the rest of this slide */
  else if(e.key==='ArrowUp'){e.preventDefault();go(i-1);}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1,true);
});
document.addEventListener('click',e=>{
  if(preOn())return;
  if(e.target.closest('input,select,button,label,a,.calc,.szr,.szrnote,.nav,#notes,.out'))return;
  step(e.clientX>window.innerWidth/2?1:-1);
});
render();
</script>
